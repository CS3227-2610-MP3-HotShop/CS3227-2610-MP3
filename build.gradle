plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'jpro-gradle-plugin'
}

group = 'hotshop'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def javafxPlatform = providers.gradleProperty('javafxPlatform').orNull
if (javafxPlatform != null && !(javafxPlatform in ['win', 'linux', 'mac', 'mac-aarch64'])) {
    throw new GradleException('javafxPlatform must be win, linux, mac, or mac-aarch64')
}

javafx {
    version = '25.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
    if (javafxPlatform != null) {
        platform = javafxPlatform
    }
}

application {
    mainClass = 'hotshop.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'one.jpro:jpro-webapi:2026.3.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jpro {
    port = 8080
    releasePlatforms = ['linux']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('migrateDatabase', JavaExec) {
    group = 'application'
    description = 'Creates or upgrades the PostgreSQL schema using operator environment settings.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'hotshop.database.DatabaseProvisioning'
}

tasks.register('migrateImages', JavaExec) {
    group = 'application'
    description = 'Imports or verifies referenced images from two existing local image roots.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'hotshop.storage.ImageImportCommand'
    doFirst {
        def windowsRoot = providers.gradleProperty('windowsImageRoot')
        def dockerRoot = providers.gradleProperty('dockerImageRoot')
        if (!windowsRoot.isPresent() || !dockerRoot.isPresent()) {
            throw new GradleException('Set windowsImageRoot and dockerImageRoot to read-only image roots')
        }
        args '--windows-root', windowsRoot.get(), '--docker-root', dockerRoot.get()
        if (providers.gradleProperty('imageImportVerifyOnly').getOrElse('false').toBoolean()) {
            args '--verify-only'
        }
    }
}

checkstyle {
    toolVersion = '12.3.1'
    maxWarnings = 0
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('shadowJar') {
    archiveFileName = javafxPlatform == null ? 'HotShop.jar' : "HotShop-${javafxPlatform}.jar"
    destinationDirectory = layout.projectDirectory.dir('release')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
}
